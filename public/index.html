<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>

<script>

if(
true
){

  eruda.init();

}

</script>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MagicDrop</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<main>

    <div class="logo">
        ✨ MagicDrop
    </div>

    <p class="subtitle">
        Share instantly on your local network.
    </p>


    <!-- =========================
         JOIN SCREEN
    ========================== -->

    <section id="joinScreen">

        <h2>Join MagicDrop</h2>

        <p class="hint">
            Choose a name for this device.
        </p>

        <input
            type="text"
            id="deviceName"
            placeholder="e.g. Aditya's Laptop"
            maxlength="30"
            autocomplete="off"
        >

        <button
            id="joinBtn"
            type="button"
        >
            🚀 Join MagicDrop
        </button>

    </section>


    <!-- =========================
         APP SCREEN
    ========================== -->

    <section id="appScreen" hidden>

        <div class="connected">
            Connected as
            <strong id="myName"></strong>
        </div>


        <h2>Send to</h2>

        <div id="devices">
            <p>No other devices connected.</p>
        </div>


        <h2>Text</h2>

        <textarea
            id="text"
            placeholder="Write something to send..."
        ></textarea>

        <button
            id="sendText"
            type="button"
        >
            💬 Send Text
        </button>


        <h2>Files</h2>

        <input
            type="file"
            id="fileInput"
            multiple
        >

        <button
            id="sendFile"
            type="button"
        >
            📤 Send Files
        </button>


        <h2>Transfers</h2>

        <div id="transfers"></div>

    </section>

</main>


<!-- =========================
     INCOMING TRANSFER
========================== -->

<div
    id="incomingModal"
    class="modal"
    hidden
>

    <div class="modal-box">

        <h2>📥 Incoming Transfer</h2>

        <p>
            From:
            <strong id="incomingSender"></strong>
        </p>

        <div id="incomingPreview"></div>

        <div class="modal-buttons">

            <button
                id="rejectBtn"
                class="reject"
                type="button"
            >
                ❌ Reject
            </button>

            <button
                id="acceptBtn"
                class="accept"
                type="button"
            >
                ✅ Accept
            </button>

        </div>

    </div>

</div>


<script src="app.js"></script>

</body>

</html>
