<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MagicDrop</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<main>

    <div class="logo">
        ✨ MagicDrop
    </div>

    <p class="subtitle">
        Share instantly on your local network.
    </p>


    <!-- JOIN -->

    <section id="joinScreen">

        <h2>Join MagicDrop</h2>

        <input
            id="deviceName"
            placeholder="Device name"
            maxlength="30"
        >

        <button id="joinBtn">
            Join
        </button>

    </section>


    <!-- APP -->

    <section id="appScreen" hidden>

        <p>
            Connected as
            <strong id="myName"></strong>
        </p>


        <h2>Send to</h2>

        <div id="devices"></div>


        <h2>Text</h2>

        <textarea
            id="text"
            placeholder="Write something to send..."
        ></textarea>

        <button id="sendText">
            💬 Send Text
        </button>


        <h2>Files</h2>

        <input
            type="file"
            id="fileInput"
            multiple
        >

        <button id="sendFile">
            📤 Send Files
        </button>


        <h2>Transfers</h2>

        <div id="transfers"></div>

    </section>

</main>


<!-- INCOMING MODAL -->

<div
    id="incomingModal"
    class="modal"
    hidden
>

    <div class="modal-box">

        <h2>📥 Incoming</h2>

        <p>
            From:
            <strong id="incomingSender"></strong>
        </p>

        <div id="incomingPreview"></div>

        <div class="modal-buttons">

            <button
                id="rejectBtn"
                class="reject"
            >
                Reject
            </button>

            <button
                id="acceptBtn"
                class="accept"
            >
                Accept
            </button>

        </div>

    </div>

</div>


<script src="app.js"></script>

</body>

</html>
